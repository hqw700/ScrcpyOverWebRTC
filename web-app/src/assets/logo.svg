<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="WebRTC Phone floating phone cloud logo">
  <defs>
    <linearGradient id="cloudBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1671FF"/><stop offset="1" stop-color="#0758EC"/></linearGradient>
    <linearGradient id="cloudTeal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12D9BC"/><stop offset="1" stop-color="#04BCAA"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1264F5"/><stop offset="1" stop-color="#074DDC"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#DBEEFF"/><stop offset="1" stop-color="#8CBDF8"/></linearGradient>
    <radialGradient id="softFloat" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1150A5" stop-opacity="0.23"/><stop offset="1" stop-color="#1150A5" stop-opacity="0"/></radialGradient>
    <filter id="floatShadow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="phoneShadow" x="-30%" y="-20%" width="170%" height="160%"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <!-- Transparent canvas; simple editable vector cloud geometry -->
  <ellipse cx="523" cy="840" rx="238" ry="44" fill="url(#softFloat)"/>
  <path d="M284 776C157 776 92 689 92 584c0-111 83-196 193-200 28-139 139-225 269-225 151 0 257 116 265 247 106 1 177 83 177 185 0 110-89 185-204 185Z" fill="url(#cloudBlue)"/>
  <!-- Teal right cloud lobe, clipped to cloud silhouette -->
  <path d="M762 388c135-17 234 73 234 198 0 117-85 190-201 190H663c-48-40-60-106-47-167 14-69 59-185 146-221Z" fill="url(#cloudTeal)"/>
  <!-- Phone floating above the cloud: simple skewed rectangles and a light extruded edge -->
  <g transform="translate(-140 0) skewX(-13)">
    <rect x="624" y="307" width="353" height="513" rx="63" fill="#062F8B" opacity="0.26" filter="url(#phoneShadow)" transform="translate(11 19)"/>
    <rect x="624" y="307" width="353" height="513" rx="63" fill="url(#edge)" transform="translate(7 17)"/>
    <rect x="624" y="296" width="353" height="513" rx="63" fill="#FFFFFF"/>
    <rect x="660" y="331" width="281" height="440" rx="42" fill="url(#screen)"/>
    <path d="M755 485 Q755 473 766 468 Q775 464 785 471 L856 517 Q873 528 856 539 L785 585 Q755 602 755 576Z" fill="#FFFFFF"/>
  </g>
</svg>
